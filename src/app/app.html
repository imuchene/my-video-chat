<p class="top-navbar">
  <mat-toolbar role="toolbar">
    <button
      matIconButton
      class="example-icon mobile-menu-btn"
      aria-label="Example icon-button with menu icon"
      (click)="sidenav.toggle()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <span class="material-symbols-outlined video-space">videocam</span>
    <span class="example-toolbar">My Video Chat</span>
    <span class="example-spacer"></span>
    <button
      matIconButton
      class="example-icon favorite-icon"
      aria-label="Example icon-button with heart icon"
    >
      <mat-icon>favorite</mat-icon>
    </button>
    <button matIconButton class="example-icon" aria-label="Example icon-button with share icon">
      <mat-icon>share</mat-icon>
    </button>
  </mat-toolbar>
</p>
<mat-sidenav-container class="example-container mobile-menu-btn">
  <mat-sidenav #sidenav mode="side" class="example-sidenav">Sidenav</mat-sidenav>
  <mat-sidenav-content>
    <p>This is a test</p>
  </mat-sidenav-content>
</mat-sidenav-container>
